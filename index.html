<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
      rel="icon"
      type="image/x-icon"
      href="https://storage.needpix.com/rsynced_images/gradient-826222_1280.jpg"
    />
  <title>Content Page</title>
  <style>
    :root {
      --orange: #f78104;
      --orange-strong: #fd5901;
      --surface: rgba(20, 24, 28, 0.88);
      --surface-border: rgba(247, 129, 4, 0.28);
      --text-main: #f4f7fb;
      --text-muted: #c8d1dc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(247, 129, 4, 0.24), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(253, 89, 1, 0.18), transparent 30%),
        linear-gradient(160deg, #0f1217, #151b22 55%, #101418);
      color: var(--text-main);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
      box-sizing: border-box;
    }

    .content-card {
      width: min(960px, 100%);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }

    .title {
      font-size: clamp(2rem, 2.8vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text-main);
      margin: 0 0 14px;
      text-align: center;
    }

    .title .accent {
      color: var(--orange);
    }

    .additional-content {
      text-align: center;
      color: var(--text-muted);
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.6;
      font-size: 1.03rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .button {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 18px;
      background-color: rgba(247, 129, 4, 0.08);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      border: 1px solid rgba(247, 129, 4, 0.45);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25);
      background: linear-gradient(120deg, var(--orange), var(--orange-strong));
      border-color: var(--orange-strong);
      color: #111;
    }

    @media screen and (max-width: 600px) {
      .content-card {
        padding: 30px 18px;
      }

      .title {
        font-size: 2rem;
      }

      .button {
        padding: 12px 14px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content-card">
      <div class="title">Welcome to my <span class="accent">Content Hub</span></div>
      <div class="additional-content">
      </div>
      <div class="buttons">
      <a class="button button1" href="/Click n' Clank/v2/index.html">Click n' Clank v2</a>
      <a class="button button2" href="https://trackerg.netlify.app">TrackerG</a>
      <a class="button button3" href="ironfront_hub.html">IRONFRONT</a>
      <a class="button button4" href="ironfront_hub.html">IRONFRONT P.O.C</a>
      <a class="button button5" href="ComingSoon.html">Coming Soon</a>
      </div>
    </div>
  </div>
</body>
</html>
 /html>
